# ============================================================================
#  Renningenieur - alle Sprüche
#
#  Hier kannst du jeden Satz ändern. Regeln:
#   - Stehen mehrere Sätze in der Liste, wird zufällig einer genommen.
#   - Wörter in {Klammern} werden vom Programm ersetzt. Welche es pro Satz
#     gibt, steht im Kommentar darüber. Du kannst sie weglassen, aber keine
#     neuen erfinden.
#   - Eine leere Liste [] schaltet die Meldung stumm.
# ============================================================================

# ---------------------------------------------------------------------------
# Bausteine, die in andere Sätze eingesetzt werden
# ---------------------------------------------------------------------------
[teile]
# {reifen}
reifen_neu = ["neuen {reifen}"]
# {reifen} {alter}
reifen_gebraucht = ["{reifen}, {alter} Runden alt"]
reifen_eine_runde = ["{reifen}, eine Runde alt"]
# {sekunden} z. B. "1,3"
sekunden = ["{sekunden} Sekunden"]
eine_sekunde = ["eine Sekunde"]
# {minuten} {sekunden}
minuten_sekunden = ["{minuten} Minuten {sekunden} Sekunden"]
eine_minute_sekunden = ["eine Minute {sekunden} Sekunden"]
# {runden}
ueberrundet = ["{runden} Runden"]
ueberrundet_eine = ["eine Runde"]

# ---------------------------------------------------------------------------
# Automatische Meldungen
# ---------------------------------------------------------------------------
[warnung]
# {name} {platz} {abstand}
box_vorne = [
  "{name} vor dir kommt an die Box.",
  "{name} vor dir biegt in die Box ab.",
]
box_hinten = [
  "{name} hinter dir kommt an die Box. Undercut-Gefahr.",
  "{name} hinter dir geht an die Box. Achtung Undercut.",
]
