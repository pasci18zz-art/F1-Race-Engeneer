]
box_raus_vor_dir = [
  "{name} ist wieder draußen, auf {reifen}. Er liegt {abstand} vor dir.",
]
# Eigener Stopp: {platz} {vorne_name} {vorne_abstand} {hinten_name} {hinten_abstand}
eigener_stopp = ["Du bist wieder draußen auf Platz {platz}."]
eigener_stopp_vorne = ["Vor dir {vorne_name}, {vorne_abstand}."]
eigener_stopp_hinten = ["Hinter dir {hinten_name}, {hinten_abstand}."]

