"Sainz" = ["sainz", "seins", "carlos"]
"Albon" = ["albon", "alex"]
"Gasly" = ["gasly", "gasli", "pierre"]
"Hülkenberg" = ["hülkenberg", "hulkenberg", "nico"]
"Tsunoda" = ["tsunoda", "yuki"]
"Ocon" = ["ocon", "okon", "esteban"]
